<!DOCTYPE html>
<html lang="da">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>
Magic Game – Battlefield
</title>


<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family:
        Arial,
        sans-serif;
    background: #111;
    color: white;
    overflow: hidden;
}

.battlefield {
    height: 100vh;

    display: grid;

    grid-template-rows:
        1fr
        76px
        1fr;

    background:
        radial-gradient(
            circle at center,
            #36523a 0%,
            #182b1c 55%,
            #0c130e 100%
        );
}

.player {
    position: relative;

    padding:
        15px 25px;

    display: grid;

    grid-template-rows:
        1fr
        auto
        115px;

    gap: 8px;
}

/* TV mode: both players face the same viewing direction. */
.player-2 {
    transform: none;
}

.player-info {
    position: absolute;

    left: 25px;
    top: 15px;

    z-index: 5;

    font-size: 20px;

    font-weight: bold;
}

.life {
    color: #ff6464;
}

.creature-zone {
    display: flex;

    align-items: center;

    justify-content: center;

    gap: 15px;
}

.artifact-zone {
    min-height: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px;
}

.artifact-card {
    width: 88px;
    height: 82px;
    background: linear-gradient(145deg, #5d6670, #262b31);
}

.artifact-card .icon {
    font-size: 28px;
}

.land-zone {
    border-top:
        1px dashed
        rgba(255,255,255,.2);

    display: flex;

    align-items: center;

    justify-content: center;

    gap: 20px;

    position: relative;
}

.zone-label {
    position: absolute;

    left: 5px;

    bottom: 5px;

    font-size: 10px;

    letter-spacing: 2px;

    opacity: .35;
}

.card {
    width: 105px;

    height: 145px;

    border-radius: 10px;

    border:
        2px solid
        rgba(255,255,255,.7);

    background:
        linear-gradient(
            145deg,
            #6b5638,
            #292116
        );

    box-shadow:
        0 8px 20px
        rgba(0,0,0,.5);

    display: flex;

    flex-direction: column;

    justify-content:
        space-between;

    padding: 9px;

    position: relative;

    transition:
        transform .35s ease,
        opacity .35s ease;
}

.land-card {
    width: 85px;

    height: 100px;

    background:
        linear-gradient(
            145deg,
            #315d35,
            #172d19
        );
}

.tapped {
    transform:
        rotate(90deg);

    opacity: .65;
}

.attacking {
    border:
        3px solid #ff674f;

    box-shadow:
        0 0 30px
        rgba(255,90,60,.65);

    transform:
        translateY(-22px)
        rotate(90deg);
}

.attacking.vigilance-attacker {
    transform:
        translateY(-22px);
}

.blocking {
    border:
        3px solid #6caeff;

    box-shadow:
        0 0 25px
        rgba(80,160,255,.6);
}

.block-label {
    position: absolute;

    left: 50%;

    bottom: -25px;

    transform:
        translateX(-50%);

    white-space: nowrap;

    font-size: 11px;

    background:
        #16365e;

    padding:
        3px 6px;

    border-radius: 6px;
}

.card-name {
    font-weight: bold;

    font-size: 14px;
}

.icon {
    font-size: 38px;

    text-align: center;
}

.land-card .icon {
    font-size: 32px;
}

.ability-mark {
    font-size: 10px;
    font-weight: 800;
    text-align: center;
    background: rgba(0,0,0,.38);
    border-radius: 6px;
    padding: 3px 5px;
    margin-top: 3px;
}

.stats {
    text-align: right;

    font-size: 18px;

    font-weight: bold;
}

.middle {
    display: flex;

    align-items: center;

    justify-content:
        space-between;

    padding:
        0 35px;

    background:
        rgba(0,0,0,.45);

    border-top:
        1px solid
        rgba(255,255,255,.2);

    border-bottom:
        1px solid
        rgba(255,255,255,.2);
}

.turn-player {
    padding:
        8px 16px;

    background: #315d35;

    border-radius: 999px;

    font-weight: bold;
}

.phase {
    font-weight: bold;

    letter-spacing: 2px;
}

.deck-info {
    opacity: .55;
}

.spell-hit {
    animation: spellHit .7s ease;
}

.player-hit {
    animation: playerHit .7s ease;
}

.damage-mark {
    position: absolute;
    left: 6px;
    bottom: 6px;
    background: #8e1f1f;
    padding: 2px 5px;
    border-radius: 999px;
    font-size: 11px;
}

.buff-mark {
    position: absolute;
    right: 6px;
    bottom: 31px;
    background: #1f6f3c;
    padding: 2px 5px;
    border-radius: 999px;
    font-size: 11px;
}

@keyframes spellHit {
    0% { transform: scale(1); filter: brightness(1); }
    35% { transform: scale(1.18); filter: brightness(2.4); }
    100% { transform: scale(1); filter: brightness(1); }
}

@keyframes playerHit {
    0% { background: transparent; }
    35% { background: rgba(255,80,30,.45); }
    100% { background: transparent; }
}

#message {
    position: fixed;

    left: 50%;
    top: 50%;

    transform:
        translate(
            -50%,
            -50%
        );

    max-width: 650px;

    padding:
        20px 30px;

    background:
        rgba(0,0,0,.92);

    border-radius: 12px;

    text-align: center;

    font-size: 22px;

    opacity: 0;

    pointer-events: none;

    z-index: 100;
}

#message.show {
    animation:
        message 3s ease;
}

@keyframes message {

    0% {
        opacity: 0;
    }

    10% {
        opacity: 1;
    }

    82% {
        opacity: 1;
    }

    100% {
        opacity: 0;
    }
}


#spellFx {
    position: fixed;
    inset: 0;
    pointer-events: none;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(54px, 8vw, 120px);
    font-weight: 950;
    text-shadow: 0 6px 24px rgba(0,0,0,.9);
    opacity: 0;
    z-index: 9999;
}
#spellFx.cast { animation: spellCast 900ms ease-out; }
@keyframes spellCast {
    0% { opacity: 0; transform: scale(.25); }
    35% { opacity: 1; transform: scale(1.25); }
    100% { opacity: 0; transform: scale(2.2); }
}

/* v5.8 Visual phase tracker */
.bf-phase-tracker{background:rgba(6,18,9,.94);border-top:1px solid #315d35;border-bottom:1px solid #315d35;padding:9px 24px}
.bf-major{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.bf-major span,.bf-steps span{padding:7px;text-align:center;border-radius:7px;background:#182019;color:#718076;border:1px solid #303b32;font-size:12px;font-weight:700}
.bf-major span.done,.bf-steps span.done{background:#18351f;color:#9dc7a6}.bf-major span.active,.bf-steps span.active{background:#315d35;color:white;border-color:#72c17d;box-shadow:0 0 12px rgba(114,193,125,.2)}
.bf-steps{display:flex;gap:7px;margin-top:7px}.bf-steps span{flex:1}

/* #58 / v6.3: TV Game Over overlay */
.game-over-overlay{position:fixed;inset:0;z-index:9999;display:none;align-items:center;justify-content:center;background:rgba(3,7,12,.88);backdrop-filter:blur(7px)}
.game-over-overlay.show{display:flex}.game-over-card{text-align:center;min-width:min(680px,82vw);padding:48px 56px;border:2px solid #d7b85b;border-radius:24px;background:linear-gradient(180deg,#1c2530,#0c1118);box-shadow:0 0 70px rgba(215,184,91,.25)}
.game-over-kicker{font-size:26px;letter-spacing:.22em;color:#d7b85b;font-weight:900}.game-over-title{font-size:64px;margin:12px 0 10px;font-weight:1000}.game-over-reason{font-size:20px;color:#c7d0da}
</style>

</head>

<div id="stackDisplay" style="position:fixed;right:18px;top:50%;z-index:20;background:rgba(0,0,0,.82);padding:10px 14px;border-radius:10px;display:none;font-weight:700"></div>
<div id="message">
</div>

<script src="/socket.io/socket.io.js"></script>


<script>

const socket = io();

function getSpellEffectText(card) {
    if (!card) return "✨";
    if (card.effect === "damage") return `${card.icon || "🔥"} ${Number(card.damage || 0)} DAMAGE`;
    if (card.effect === "pump") return `${card.icon || "🌿"} +${Number(card.powerBonus || 0)}/+${Number(card.toughnessBonus || 0)}`;
    if (card.effect === "plus1_counter") {
        const n = Number(card.counters || 1);
        return `${card.icon || "➕"} +${n}/+${n} COUNTER`;
    }
    if (card.effect === "draw_cards") return `${card.icon || "📚"} DRAW ${Number(card.amount || 1)}`;
    if (card.effect === "discard_cards") return `${card.icon || "🧠"} DISCARD ${Number(card.amount || 1)}`;
    return `${card.icon || "✨"} ${card.name || "SPELL"}`;
}


socket.on(
    "gameState",
    state => {

        const stackDisplay = document.getElementById("stackDisplay");
        const stack = state.stack || [];
        if (stack.length) {
            stackDisplay.style.display = "block";
            stackDisplay.innerHTML = "STACK<br>" + stack.slice().reverse().map((item, i) => {
                const effect = item.card && item.card.type === "spell" ? ` · ${getSpellEffectText(item.card)}` : "";
                return `${i === 0 ? "⬆️" : "•"} ${item.card.icon || "✨"} ${item.card.name}${effect} · P${item.caster}`;
            }).join("<br>") + `<br><small>Priority: P${state.priorityPlayer}</small>`;
        } else {
            stackDisplay.style.display = "none";
        }

        renderGameState(
            state
        );
        if (state.gameOver) {
            showGameOver({ winner: state.winner, loser: state.loser, reason: state.gameOverReason });
        } else {
            const overlay = document.getElementById("gameOverOverlay");
            if (overlay) overlay.classList.remove("show");
        }
    }
);


socket.on(
    "combatMessage",
    data => {

        showMessage(
            data.text
        );
    }
);


socket.on(
    "combatResolved",
    data => {

        showMessage(
            data.messages.join(
                " "
            )
        );
    }
);


socket.on("spellCast", data => {
    showMessage(data.message);
});

socket.on(
    "spellResolved",
    data => {
        const fx = document.getElementById("spellFx");
        fx.textContent = getSpellEffectText(data.card);
        fx.classList.remove("cast");
        void fx.offsetWidth;
        fx.classList.add("cast");

        if (data.target && data.target.type === "creature") {
            const target = document.querySelector(`[data-creature-id="${data.target.id}"]`);
            if (target) {
                target.classList.remove("spell-hit");
                void target.offsetWidth;
                target.classList.add("spell-hit");
            }
        } else if (data.target && data.target.type === "player") {
            const section = document.querySelector(`.player-${data.target.player}`);
            if (section) {
                section.classList.remove("player-hit");
                void section.offsetWidth;
                section.classList.add("player-hit");
            }
        }

        showMessage(data.message);
    }
);


function showGameOver(data) {
    const overlay = document.getElementById("gameOverOverlay");
    if (!overlay) return;
    const winner = Number(data.winner || 0);
    document.getElementById("gameOverKicker").textContent = winner ? "🏆 VICTORY" : "⚔️ GAME OVER";
    document.getElementById("gameOverTitle").textContent = winner ? `PLAYER ${winner} WINS` : "DRAW";
    document.getElementById("gameOverReason").textContent = data.reason || "Kampen er slut.";
    overlay.classList.add("show");
}

socket.on("gameOver", showGameOver);

socket.on("gameReset", () => {
    const overlay = document.getElementById("gameOverOverlay");
    if (overlay) overlay.classList.remove("show");
});


// ======================================================
// RENDER
// ======================================================


function renderBattlefieldPhaseTracker(state){
 const step=state.turnStep||state.phase;
 const groups=[
 {name:"BEGINNING",steps:[["untap","Untap"],["upkeep","Upkeep"],["draw","Draw"]]},
 {name:"MAIN PHASE 1",steps:[["main1","Main 1"],["main","Main 1"]]},
 {name:"COMBAT",steps:[["begin_combat","Beginning"],["declare_attackers","Attackers"],["choose_attackers","Attackers"],["declare_blockers","Blockers"],["choose_blockers","Blockers"],["combat_damage","Damage"],["end_combat","End"]]},
 {name:"MAIN PHASE 2",steps:[["main2","Main 2"]]},
 {name:"ENDING",steps:[["end_step","End"],["cleanup","Cleanup"]]}];
 let gi=groups.findIndex(g=>g.steps.some(x=>x[0]===step)); if(gi<0)gi=0;
 const a=document.getElementById('bfMajor'),b=document.getElementById('bfSteps'); if(!a||!b)return;
 a.innerHTML=groups.map((g,i)=>`<span class="${i<gi?'done':i===gi?'active':''}">${i<gi?'✓ ':''}${g.name}</span>`).join('');
 const u=[];groups[gi].steps.forEach(x=>{if(!u.some(y=>y[1]===x[1]))u.push(x)});let ai=u.findIndex(x=>groups[gi].steps.filter(y=>y[1]===x[1]).some(y=>y[0]===step));
 b.innerHTML=u.map((x,i)=>`<span class="${i<ai?'done':i===ai?'active':''}">${i<ai?'✓ ':''}${x[1]}</span>`).join('');
}

function renderGameState(
    state
) {

    renderBattlefieldPhaseTracker(state);

    document
        .getElementById(
            "turnPlayer"
        )
        .textContent =
        "PLAYER " +
        state.currentPlayer;


    document
        .getElementById(
            "turnNumber"
        )
        .textContent =
        state.turnNumber;


    const phases = {
        opening_hand: "OPENING HAND",
        untap: "UNTAP STEP",
        upkeep: "UPKEEP STEP",
        draw: "DRAW STEP",
        main: "PRECOMBAT MAIN",
        begin_combat: "BEGINNING OF COMBAT",
        choose_attackers: "DECLARE ATTACKERS",
        choose_blockers: "DECLARE BLOCKERS",
        combat_damage: "COMBAT DAMAGE",
        end_combat: "END OF COMBAT",
        main2: "MAIN PHASE 2",
        end_step: "END STEP",
        cleanup: "CLEANUP STEP"
    };


    document
        .getElementById(
            "phaseText"
        )
        .textContent =
        phases[
            state.phase
        ];


    renderPlayer(
        1,
        state.players[1],
        state
    );


    renderPlayer(
        2,
        state.players[2],
        state
    );
}


function renderPlayer(
    playerNumber,
    player,
    state
) {

    document
        .getElementById(
            `p${playerNumber}Life`
        )
        .textContent =
        player.life;


    document
        .getElementById(
            `p${playerNumber}Hand`
        )
        .textContent =
        player.handCount;


    document
        .getElementById(
            `p${playerNumber}Deck`
        )
        .textContent =
        player.libraryCount;


    document
        .getElementById(
            `p${playerNumber}Grave`
        )
        .textContent =
        player.graveyardCount || 0;

    const exileCount =
        player.exile
            ? player.exile.length
            : 0;


    const creatureArea =
        document.getElementById(
            `player${playerNumber}Creatures`
        );


    const landArea =
        document.getElementById(
            `player${playerNumber}Lands`
        );


    creatureArea.innerHTML = "";


    landArea
        .querySelectorAll(
            ".card"
        )
        .forEach(
            element =>
                element.remove()
        );


    const artifactArea =
        document.getElementById(
            `player${playerNumber}Artifacts`
        );

    artifactArea.innerHTML = "";

    (player.artifacts || []).forEach(
        artifact => {
            const element = document.createElement("div");
            element.className = "card artifact-card";
            if (artifact.tapped) element.classList.add("tapped");

            element.innerHTML = `
                <div class="card-name">${artifact.name}</div>
                <div class="icon">${artifact.icon || "⚙️"}</div>
                ${artifact.activatedAbility
                    ? `<div class="ability-mark">${
                        artifact.activatedAbility.cost === "sacrifice_creature"
                            ? "💀 SAC CREATURE → +3 LIFE"
                            : "⚡ TAP → +1 LIFE"
                    }</div>`
                    : ""}
                <div class="ability-mark">${artifact.tapped ? "↻ TAPPED" : "⚙️ ARTIFACT"}</div>
            `;

            artifactArea.appendChild(element);
        }
    );


    // --------------------------------------
    // CREATURES
    // --------------------------------------

    player.creatures.forEach(
        creature => {

            const element =
                document.createElement(
                    "div"
                );


            element.className =
                "card";

            element.dataset.creatureId = creature.id;


            if (
                creature.tapped
            ) {

                element.classList.add(
                    "tapped"
                );
            }


            if (
                playerNumber ===
                    state.currentPlayer &&
                state.combat
                    .attackerIds
                    .includes(
                        creature.id
                    )
            ) {

                element.classList.add(
                    "attacking"
                );

                if (Array.isArray(creature.abilities) && creature.abilities.includes("vigilance")) {
                    element.classList.add("vigilance-attacker");
                }
            }


            const blockingTarget =
                findBlockingTarget(
                    creature.id,
                    state.combat
                        .blockers
                );


            if (blockingTarget) {

                element.classList.add(
                    "blocking"
                );
            }


            element.innerHTML = `

                <div class="card-name">
                    ${creature.name}
                </div>

                <div class="icon">
                    ${creature.icon}
                </div>

                <div class="stats">
                    ${Number(creature.power || 0)}/${Number(creature.toughness || 0)}
                </div>

            `;

            if (Array.isArray(creature.abilities) && creature.abilities.includes("trample")) {
                const ability = document.createElement("div");
                ability.className = "ability-mark";
                ability.textContent = "🐾 TRAMPLE";
                element.appendChild(ability);
            }

            if (Array.isArray(creature.abilities) && creature.abilities.includes("first_strike")) {
                const ability = document.createElement("div");
                ability.className = "ability-mark";
                ability.textContent = "⚔️ FIRST STRIKE";
                element.appendChild(ability);
            }

            if (Array.isArray(creature.abilities) && creature.abilities.includes("double_strike")) {
                const ability = document.createElement("div");
                ability.className = "ability-mark";
                ability.textContent = "⚔️⚔️ DOUBLE STRIKE";
                element.appendChild(ability);
            }

            if (Array.isArray(creature.abilities) && creature.abilities.includes("deathtouch")) {
                const ability = document.createElement("div");
                ability.className = "ability-mark";
                ability.textContent = "☠️ DEATHTOUCH";
                element.appendChild(ability);
            }

            if (Array.isArray(creature.abilities) && creature.abilities.includes("lifelink")) {
                const ability = document.createElement("div");
                ability.className = "ability-mark";
                ability.textContent = "❤️ LIFELINK";
                element.appendChild(ability);
            }

            if (Array.isArray(creature.abilities) && creature.abilities.includes("flying")) {
                const ability = document.createElement("div");
                ability.className = "ability-mark";
                ability.textContent = "🪽 FLYING";
                element.appendChild(ability);
            }

            if (Array.isArray(creature.abilities) && creature.abilities.includes("reach")) {
                const ability = document.createElement("div");
                ability.className = "ability-mark";
                ability.textContent = "🏹 REACH";
                element.appendChild(ability);
            }

            if (Array.isArray(creature.abilities) && creature.abilities.includes("vigilance")) {
                const ability = document.createElement("div");
                ability.className = "ability-mark";
                ability.textContent = "👁️ VIGILANCE";
                element.appendChild(ability);
            }

            if (Array.isArray(creature.abilities) && creature.abilities.includes("haste")) {
                const ability = document.createElement("div");
                ability.className = "ability-mark";
                ability.textContent = "⚡ HASTE";
                element.appendChild(ability);
            }

            if (Array.isArray(creature.abilities) && creature.abilities.includes("menace")) {
                const ability = document.createElement("div");
                ability.className = "ability-mark";
                ability.textContent = "👹 MENACE";
                element.appendChild(ability);
            }

            if (Array.isArray(creature.abilities) && creature.abilities.includes("hexproof")) {
                const ability = document.createElement("div");
                ability.className = "ability-mark";
                ability.textContent = "🛡️ HEXPROOF";
                element.appendChild(ability);
            }

            if (Array.isArray(creature.abilities) && creature.abilities.includes("indestructible")) {
                const ability = document.createElement("div");
                ability.className = "ability-mark";
                ability.textContent = "💎 INDESTRUCTIBLE";
                element.appendChild(ability);
            }

            if (Array.isArray(creature.abilities) && creature.abilities.includes("ward_2")) {
                const ability = document.createElement("div");
                ability.className = "ability-mark";
                ability.textContent = "🛡️ WARD 2";
                element.appendChild(ability);
            }

            if (Array.isArray(creature.abilities) && creature.abilities.includes("protection_red")) {
                const ability = document.createElement("div");
                ability.className = "ability-mark";
                ability.textContent = "🛡️ PROTECTION RED";
                element.appendChild(ability);
            }

            if (Array.isArray(creature.abilities) && creature.abilities.includes("flash")) {
                const ability = document.createElement("div");
                ability.className = "ability-mark";
                ability.textContent = "⚡ FLASH";
                element.appendChild(ability);
            }

            if (Array.isArray(creature.abilities) && creature.abilities.includes("defender")) {
                const ability = document.createElement("div");
                ability.className = "ability-mark";
                ability.textContent = "🧱 DEFENDER";
                element.appendChild(ability);
            }

            if (Number(creature.plus1Counters || 0) > 0) {
                const counter = document.createElement("div");
                counter.className = "ability-mark";
                counter.textContent = `➕ +1/+1 × ${Number(creature.plus1Counters)}`;
                element.appendChild(counter);
            }

            if (creature.isToken) {
                const token = document.createElement("div");
                token.className = "ability-mark";
                token.textContent = "● TOKEN";
                element.appendChild(token);
            }

            if (creature.triggeredAbility) {
                const trigger = document.createElement("div");
                trigger.className = "ability-mark";
                trigger.textContent = `🔔 ${creature.triggeredAbility.text}`;
                element.appendChild(trigger);
            }

            if (creature.etbAbility) {
                const etb = document.createElement("div");
                etb.className = "ability-mark";
                etb.textContent = `✨ ETB · +${Number(creature.etbAbility.amount || 0)} LIFE`;
                element.appendChild(etb);
            }

            if (Array.isArray(creature.attachedAuras)) {
                creature.attachedAuras.forEach(aura => {
                    const mark = document.createElement("div");
                    mark.className = "ability-mark";
                    mark.textContent = `✨ ${aura.name} +${Number(aura.powerBonus || 0)}/+${Number(aura.toughnessBonus || 0)}`;
                    element.appendChild(mark);
                });
            }

            if (Number(creature.damageMarked || 0) > 0) {
                const damage = document.createElement("div");
                damage.className = "damage-mark";
                damage.textContent = `🔥 ${creature.damageMarked}`;
                element.appendChild(damage);
            }

            if (Number(creature.tempPowerBonus || 0) > 0 || Number(creature.tempToughnessBonus || 0) > 0) {
                const buff = document.createElement("div");
                buff.className = "buff-mark";
                buff.textContent = `🌿 +${creature.tempPowerBonus || 0}/+${creature.tempToughnessBonus || 0}`;
                element.appendChild(buff);
            }


            if (blockingTarget) {

                const attacker =
                    findCreatureById(
                        blockingTarget,
                        state
                    );


                const label =
                    document.createElement(
                        "div"
                    );


                label.className =
                    "block-label";


                label.textContent =
                    attacker
                        ? `🛡️ ${attacker.name}`
                        : "🛡️ BLOCK";


                element.appendChild(
                    label
                );
            }


            creatureArea
                .appendChild(
                    element
                );
        }
    );


    // --------------------------------------
    // LANDS
    // --------------------------------------

    player.lands.forEach(
        land => {

            const element =
                document.createElement(
                    "div"
                );


            element.className =
                "card land-card";


            if (
                land.tapped
            ) {

                element.classList.add(
                    "tapped"
                );
            }


            element.innerHTML = `

                <div class="card-name">
                    ${land.name}
                </div>

                <div class="icon">
                    ${land.icon}
                </div>

                <div class="stats">
                    MANA
                </div>

            `;


            landArea
                .appendChild(
                    element
                );
        }
    );
}


// ======================================================
// COMBAT HELPERS
// ======================================================

function findBlockingTarget(
    blockerId,
    blockers
) {

    for (
        const attackerId
        of Object.keys(
            blockers
        )
    ) {

        if (
            (
                blockers[
                    attackerId
                ] || []
            )
            .includes(
                blockerId
            )
        ) {

            return attackerId;
        }
    }


    return null;
}


function findCreatureById(
    id,
    state
) {

    return [

        ...state.players[1]
            .creatures,

        ...state.players[2]
            .creatures

    ]
    .find(
        creature =>
            creature.id === id
    );
}


// ======================================================
// MESSAGE
// ======================================================

function showMessage(text) {

    const element =
        document.getElementById(
            "message"
        );


    element.textContent =
        text;


    element
        .classList
        .remove(
            "show"
        );


    void element.offsetWidth;


    element
        .classList
        .add(
            "show"
        );
}

</script>
