<!DOCTYPE html>
<html lang="da">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>
Magic Game – Battlefield
</title>


<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family:
        Arial,
        sans-serif;
    background: #111;
    color: white;
    overflow: hidden;
}

.battlefield {
    height: 100vh;

    display: grid;

    grid-template-rows:
        1fr
        76px
        1fr;

    background:
        radial-gradient(
            circle at center,
            #36523a 0%,
            #182b1c 55%,
            #0c130e 100%
        );
}

.player {
    position: relative;

    padding:
        15px 25px;

    display: grid;

    grid-template-rows:
        1fr
        auto
        115px;

    gap: 8px;
}

/* TV mode: both players face the same viewing direction. */
.player-2 {
    transform: none;
    /* P2 is mirrored spatially: lands at the back/top, creatures toward the centre. */
    grid-template-rows:
        115px
        auto
        1fr;
}

.player-2 .land-zone {
    border-top: 0;
    border-bottom: 1px solid rgba(255,255,255,.12);
}

.player-2 .zone-label {
    top: 5px;
    bottom: auto;
}

.player-info {
    position: absolute;

    left: 25px;
    top: 15px;

    z-index: 5;

    font-size: 20px;

    font-weight: bold;
}

.life {
    color: #ff6464;
}

.creature-zone {
    display: flex;

    align-items: center;

    justify-content: center;

    gap: 15px;
}

.artifact-zone {
    min-height: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px;
}

.artifact-card {
    width: 88px;
    height: 82px;
    background: linear-gradient(145deg, #5d6670, #262b31);
}

.artifact-card .icon {
    font-size: 28px;
}

.land-zone {
    border-top:
        1px dashed
        rgba(255,255,255,.2);

    display: flex;

    align-items: center;

    justify-content: center;

    gap: 20px;

    position: relative;
}

.zone-label {
    position: absolute;

    left: 5px;

    bottom: 5px;

    font-size: 10px;

    letter-spacing: 2px;

    opacity: .35;
}

.card {
    width: 105px;

    height: 145px;

    border-radius: 10px;

    border:
        2px solid
        rgba(255,255,255,.7);

    background:
        linear-gradient(
            145deg,
            #6b5638,
            #292116
        );

    box-shadow:
        0 8px 20px
        rgba(0,0,0,.5);

    display: flex;

    flex-direction: column;

    justify-content:
        space-between;

    padding: 9px;

    position: relative;

    transition:
        transform .35s ease,
        opacity .35s ease;
}

.land-card {
    width: 85px;

    height: 100px;

    background:
        linear-gradient(
            145deg,
            #315d35,
            #172d19
        );
}

.tapped {
    transform:
        rotate(90deg);

    opacity: .65;
}

.attacking {
    border:
        3px solid #ff674f;

    box-shadow:
        0 0 30px
        rgba(255,90,60,.65);

    transform:
        translateY(-22px)
        rotate(90deg);
}

.attacking.vigilance-attacker {
    transform:
        translateY(-22px);
}

.blocking {
    border:
        3px solid #6caeff;

    box-shadow:
        0 0 25px
        rgba(80,160,255,.6);
}

.block-label {
    position: absolute;

    left: 50%;

    bottom: -25px;

    transform:
        translateX(-50%);

    white-space: nowrap;

    font-size: 11px;

    background:
        #16365e;

    padding:
        3px 6px;

    border-radius: 6px;
}

.card-name {
    font-weight: bold;

    font-size: 14px;
}

.icon {
    font-size: 38px;

    text-align: center;
}

.land-card .icon {
    font-size: 32px;
}

.ability-mark {
    font-size: 10px;
    font-weight: 800;
    text-align: center;
    background: rgba(0,0,0,.38);
    border-radius: 6px;
    padding: 3px 5px;
    margin-top: 3px;
}

.stats {
    text-align: right;

    font-size: 18px;

    font-weight: bold;
}

.middle {
    display: flex;

    align-items: center;

    justify-content:
        space-between;

    padding:
        0 35px;

    background:
        rgba(0,0,0,.45);

    border-top:
        1px solid
        rgba(255,255,255,.2);

    border-bottom:
        1px solid
        rgba(255,255,255,.2);
}

.turn-player {
    padding:
        8px 16px;

    background: #315d35;

    border-radius: 999px;

    font-weight: bold;
}

.phase {
    font-weight: bold;

    letter-spacing: 2px;
}

.deck-info {
    opacity: .55;
}

.spell-hit {
    animation: spellHit .7s ease;
}

.player-hit {
    animation: playerHit .7s ease;
}

.damage-mark {
    position: absolute;
    left: 6px;
    bottom: 6px;
    background: #8e1f1f;
    padding: 2px 5px;
    border-radius: 999px;
    font-size: 11px;
}

.buff-mark {
    position: absolute;
    right: 6px;
    bottom: 31px;
    background: #1f6f3c;
    padding: 2px 5px;
    border-radius: 999px;
    font-size: 11px;
}

@keyframes spellHit {
    0% { transform: scale(1); filter: brightness(1); }
    35% { transform: scale(1.18); filter: brightness(2.4); }
    100% { transform: scale(1); filter: brightness(1); }
}

@keyframes playerHit {
    0% { background: transparent; }
    35% { background: rgba(255,80,30,.45); }
    100% { background: transparent; }
}

#message {
    position: fixed;

    left: 50%;
    top: 50%;

    transform:
        translate(
            -50%,
            -50%
        );

    max-width: 650px;

    padding:
        20px 30px;

    background:
        rgba(0,0,0,.92);

    border-radius: 12px;

    text-align: center;

    font-size: 22px;

    opacity: 0;

    pointer-events: none;

    z-index: 100;
}

#message.show {
    animation:
        message 3s ease;
}

@keyframes message {

    0% {
        opacity: 0;
    }

    10% {
        opacity: 1;
    }

    82% {
        opacity: 1;
    }

    100% {
        opacity: 0;
    }
}


#spellFx {
    position: fixed;
    inset: 0;
    pointer-events: none;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(54px, 8vw, 120px);
    font-weight: 950;
    text-shadow: 0 6px 24px rgba(0,0,0,.9);
    opacity: 0;
    z-index: 9999;
}
#spellFx.cast { animation: spellCast 900ms ease-out; }
@keyframes spellCast {
    0% { opacity: 0; transform: scale(.25); }
    35% { opacity: 1; transform: scale(1.25); }
    100% { opacity: 0; transform: scale(2.2); }
}

/* v5.8 Visual phase tracker */
.bf-phase-tracker{background:rgba(6,18,9,.94);border-top:1px solid #315d35;border-bottom:1px solid #315d35;padding:9px 24px}
.bf-major{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.bf-major span,.bf-steps span{padding:7px;text-align:center;border-radius:7px;background:#182019;color:#718076;border:1px solid #303b32;font-size:12px;font-weight:700}
.bf-major span.done,.bf-steps span.done{background:#18351f;color:#9dc7a6}.bf-major span.active,.bf-steps span.active{background:#315d35;color:white;border-color:#72c17d;box-shadow:0 0 12px rgba(114,193,125,.2)}
.bf-steps{display:flex;gap:7px;margin-top:7px}.bf-steps span{flex:1}

/* #58 / v6.3: TV Game Over overlay */
.game-over-overlay{position:fixed;inset:0;z-index:9999;display:none;align-items:center;justify-content:center;background:rgba(3,7,12,.88);backdrop-filter:blur(7px)}
.game-over-overlay.show{display:flex}.game-over-card{text-align:center;min-width:min(680px,82vw);padding:48px 56px;border:2px solid #d7b85b;border-radius:24px;background:linear-gradient(180deg,#1c2530,#0c1118);box-shadow:0 0 70px rgba(215,184,91,.25)}
.game-over-kicker{font-size:26px;letter-spacing:.22em;color:#d7b85b;font-weight:900}.game-over-title{font-size:64px;margin:12px 0 10px;font-weight:1000}.game-over-reason{font-size:20px;color:#c7d0da}

/* v6.7.3 Realm Battlefield Visual Test */
body::before {
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:0;
    background:#020506;
}

.battlefield {
    position:relative;
    z-index:1;
    grid-template-rows:minmax(0,1fr) 68px minmax(0,1fr);
    background:#020506;
    isolation:isolate;
}

.player {
    padding:12px 22px;
    grid-template-rows:minmax(0,1fr) auto 128px;
    gap:5px;
    overflow:hidden;
    isolation:isolate;
}

.player > *:not(.realm-art):not(.realm-badge) {
    position:relative;
    z-index:3;
}

.realm-art {
    position:absolute;
    inset:0;
    z-index:0;
    pointer-events:none;
    overflow:hidden;
    transition:background 900ms ease, filter 900ms ease;
}

.realm-art::before,
.realm-art::after {
    content:"";
    position:absolute;
    inset:-15%;
    pointer-events:none;
}

.realm-svg {
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    opacity:0;
    transition:opacity 900ms ease;
}

.realm-badge {
    position:absolute;
    z-index:2;
    right:28px;
    top:18px;
    font-size:clamp(54px,6vw,104px);
    line-height:1;
    font-weight:1000;
    letter-spacing:.06em;
    color:rgba(255,255,255,.075);
    text-shadow:0 0 35px rgba(255,255,255,.06);
    pointer-events:none;
    user-select:none;
}
.player-1 .realm-badge { top:auto; bottom:18px; }

/* ---------- RED / BURNING LEGION ---------- */
.player.theme-red .realm-art {
    background:
        linear-gradient(180deg, rgba(3,2,5,.98) 0%, rgba(30,4,5,.94) 46%, rgba(74,13,5,.88) 100%),
        radial-gradient(circle at 52% 75%, rgba(255,83,15,.72), transparent 28%);
}
.player.theme-red .realm-art::before {
    background:
        radial-gradient(circle at 12% 20%, rgba(255,191,73,.95) 0 1px, transparent 2px),
        radial-gradient(circle at 29% 61%, rgba(255,98,31,.95) 0 1.2px, transparent 2.2px),
        radial-gradient(circle at 71% 36%, rgba(255,155,42,.9) 0 1px, transparent 2px),
        radial-gradient(circle at 88% 68%, rgba(255,76,21,.9) 0 1.5px, transparent 2.5px);
    background-size:79px 83px,113px 127px,149px 137px,181px 173px;
    animation:emberRise 8s linear infinite;
    opacity:.72;
    filter:drop-shadow(0 0 4px rgba(255,79,18,.8));
}
.player.theme-red .realm-art::after {
    background:
        radial-gradient(ellipse at 50% 100%, rgba(255,72,0,.42), transparent 42%),
        linear-gradient(110deg, transparent 0 46%, rgba(255,86,13,.16) 48%, transparent 50% 100%);
    animation:infernoPulse 4.2s ease-in-out infinite alternate;
}
.player.theme-red .realm-svg.red-scene { opacity:.92; }
.player.theme-red .realm-badge { color:rgba(255,93,43,.15); text-shadow:0 0 34px rgba(255,58,20,.2); }

/* ---------- GREEN / FOREST FURY ---------- */
.player.theme-green .realm-art {
    background:
        linear-gradient(180deg, rgba(2,10,11,.98) 0%, rgba(3,25,19,.94) 52%, rgba(5,46,27,.92) 100%),
        radial-gradient(circle at 50% 18%, rgba(83,255,176,.25), transparent 28%);
}
.player.theme-green .realm-art::before {
    background:
        radial-gradient(circle at 8% 22%, rgba(162,255,205,.95) 0 1px, transparent 2px),
        radial-gradient(circle at 33% 54%, rgba(98,255,174,.9) 0 1.2px, transparent 2.2px),
        radial-gradient(circle at 67% 30%, rgba(189,255,219,.9) 0 1px, transparent 2px),
        radial-gradient(circle at 91% 72%, rgba(76,238,148,.9) 0 1.5px, transparent 2.5px);
    background-size:101px 97px,137px 151px,167px 139px,191px 183px;
    animation:fireflyDrift 13s ease-in-out infinite alternate;
    opacity:.65;
    filter:drop-shadow(0 0 5px rgba(84,255,169,.75));
}
.player.theme-green .realm-art::after {
    background:
        radial-gradient(ellipse at 50% 88%, rgba(74,235,148,.15), transparent 36%),
        linear-gradient(180deg, transparent 48%, rgba(173,255,218,.07) 62%, transparent 78%);
    animation:forestMist 8s ease-in-out infinite alternate;
}
.player.theme-green .realm-svg.green-scene { opacity:.94; }
.player.theme-green .realm-badge { color:rgba(100,255,168,.13); text-shadow:0 0 34px rgba(67,255,153,.15); }

/* ---------- NEUTRAL / BEFORE DECK CHOICE ---------- */
.player.theme-neutral .realm-art {
    background:
       radial-gradient(ellipse at center, rgba(29,42,52,.7), transparent 58%),
       linear-gradient(180deg,#070b10,#030507);
}
.player.theme-neutral .realm-art::before {
    background-image:radial-gradient(circle,rgba(255,255,255,.5) 0 1px,transparent 1.6px);
    background-size:111px 111px;
    animation:starDrift 22s linear infinite;
    opacity:.3;
}

@keyframes emberRise {
    from { transform:translate3d(0,12%,0) scale(1); }
    to { transform:translate3d(18px,-18%,0) scale(1.04); }
}
@keyframes infernoPulse {
    from { opacity:.55; filter:blur(2px); }
    to { opacity:1; filter:blur(5px); }
}
@keyframes fireflyDrift {
    from { transform:translate3d(-10px,8px,0); }
    to { transform:translate3d(24px,-22px,0); }
}
@keyframes forestMist {
    from { transform:translateX(-2%); opacity:.55; filter:blur(5px); }
    to { transform:translateX(2%); opacity:1; filter:blur(10px); }
}
@keyframes starDrift { to { transform:translate3d(42px,-55px,0); } }

.creature-zone { gap:18px; align-items:center; }
.land-zone { gap:22px; border-top:1px solid rgba(255,255,255,.12); }
.card {
    width:132px;
    height:182px;
    border-radius:12px;
    padding:11px;
    background:linear-gradient(145deg,rgba(91,70,43,.97),rgba(28,21,14,.98));
    box-shadow:0 12px 30px rgba(0,0,0,.66),0 0 18px rgba(255,255,255,.07);
}
.card .icon { font-size:46px; }
.card-name { font-size:15px; }
.stats { font-size:18px; }
.land-card { width:104px; height:122px; }
.land-card .icon { font-size:34px; }
.artifact-card { width:108px; height:100px; }

.player.theme-red .land-card {
    background:linear-gradient(145deg,#782a18,#2b0b08);
    box-shadow:0 10px 28px rgba(0,0,0,.6),0 0 20px rgba(255,82,24,.16);
}
.player.theme-green .land-card {
    background:linear-gradient(145deg,#2e6a45,#10291a);
    box-shadow:0 10px 28px rgba(0,0,0,.6),0 0 20px rgba(73,234,143,.12);
}

.middle,
.bf-phase-tracker {
    position:relative;
    z-index:8;
    backdrop-filter:blur(8px);
}
.middle {
    background:linear-gradient(90deg,rgba(5,7,10,.98),rgba(21,24,29,.94),rgba(5,7,10,.98));
    border-color:rgba(255,255,255,.14);

}

}



/* v6.7.4 Realm Clash tuning: less dead black space, realms meet in the middle */
.battlefield {
    grid-template-rows:minmax(0,1fr) 54px minmax(0,1fr);
}

.player.theme-red .realm-art {
    background:
        radial-gradient(ellipse at 50% 92%, rgba(255,79,10,.58) 0%, rgba(111,18,5,.30) 26%, transparent 54%),
        linear-gradient(180deg, #090204 0%, #250607 48%, #641506 100%);
}
.player.theme-red .realm-art::after {
    background:
        radial-gradient(ellipse at 50% 100%, rgba(255,88,0,.62), transparent 48%),
        radial-gradient(ellipse at 22% 96%, rgba(255,52,0,.28), transparent 28%),
        radial-gradient(ellipse at 80% 92%, rgba(255,120,10,.22), transparent 30%);
}

.player.theme-green .realm-art {
    background:
        radial-gradient(ellipse at 50% 8%, rgba(74,255,160,.28) 0%, rgba(15,103,66,.17) 27%, transparent 58%),
        linear-gradient(180deg, #073125 0%, #06251b 42%, #04130e 100%);
}
.player.theme-green .realm-art::after {
    background:
        radial-gradient(ellipse at 50% 3%, rgba(77,255,168,.26), transparent 38%),
        linear-gradient(180deg, rgba(119,255,193,.10) 0%, transparent 30%, rgba(36,155,96,.10) 68%, transparent 100%),
        radial-gradient(ellipse at 18% 20%, rgba(85,255,175,.11), transparent 22%),
        radial-gradient(ellipse at 82% 18%, rgba(94,232,178,.10), transparent 24%);
}

/* Pull both landscapes toward the center line */
.player-2 .realm-svg { transform:translateY(4%) scaleY(1.12); transform-origin:bottom center; }
.player-1 .realm-svg { transform:translateY(-13%) scaleY(1.32); transform-origin:top center; }
.player-1 .realm-svg.green-scene { filter:drop-shadow(0 -10px 22px rgba(45,217,132,.14)); }
.player-2 .realm-svg.red-scene { filter:drop-shadow(0 12px 28px rgba(255,64,8,.16)); }

/* Soft clash-light at the border so the two realms visually meet */
.player-2::after,
.player-1::before {
    content:"";
    position:absolute;
    left:0;
    right:0;
    height:72px;
    z-index:1;
    pointer-events:none;
}
.player-2::after {
    bottom:0;
    background:linear-gradient(180deg, transparent, rgba(255,66,8,.12));
}
.player-1::before {
    top:0;
    background:linear-gradient(180deg, rgba(55,255,151,.12), transparent);
}

.middle { padding:0 22px; }

@media (max-height:850px) {
    .card{width:116px;height:158px}
    .land-card{width:92px;height:108px}
    .player{grid-template-rows:minmax(0,1fr) auto 112px}
}
@media (prefers-reduced-motion:reduce) {
    .realm-art::before,.realm-art::after{animation:none!important}
}


/* v6.7.6 TV Arena: resource rail + large creature stage */
.battlefield{grid-template-rows:1fr 72px 1fr;background:#070b0d;}
.player{padding:14px 22px;display:grid;grid-template-columns:minmax(270px,32%) 1fr;grid-template-rows:1fr;gap:20px;overflow:hidden;}
.player-1,.player-2{transform:none;}
.player-info{left:26px;top:16px;z-index:12;}
.creature-zone{grid-column:2;grid-row:1;display:flex;align-items:center;justify-content:center;gap:22px;min-width:0;padding:48px 24px 18px;z-index:5;}
.land-zone{grid-column:1;grid-row:1;display:flex;align-items:flex-end;align-content:flex-end;justify-content:flex-start;flex-wrap:wrap;gap:8px 6px;padding:58px 10px 18px;border-top:0;border-right:1px solid rgba(255,255,255,.10);z-index:5;}
.artifact-zone{grid-column:1;grid-row:1;align-self:center;justify-self:stretch;display:flex;justify-content:center;align-items:center;gap:8px;padding:0 12px;z-index:7;pointer-events:none;}
.player-2 .land-zone{align-items:flex-start;align-content:flex-start;padding-top:58px;padding-bottom:18px;}
.player-2 .artifact-zone{align-self:center;}
.card:not(.land-card):not(.artifact-card){width:150px;height:205px;border-radius:14px;padding:12px;box-shadow:0 12px 30px rgba(0,0,0,.58),0 0 18px rgba(255,255,255,.05);}
.card:not(.land-card):not(.artifact-card) .icon{font-size:52px;}
.card:not(.land-card):not(.artifact-card) .card-name{font-size:16px;}
.card:not(.land-card):not(.artifact-card) .stats{font-size:20px;}
.land-card{width:72px;height:86px;padding:7px;border-radius:9px;}
.land-card .icon{font-size:24px}.land-card .card-name{font-size:10px}.land-card .stats{font-size:10px;}
.artifact-card{width:76px;height:82px;padding:7px;}
.middle{z-index:20;box-shadow:0 0 22px rgba(0,0,0,.75);}
.bf-phase-tracker{z-index:21;padding:7px 14px;}
/* Let each selected realm own the whole player half; the former black void disappears. */
.player.realm-mountain{background:radial-gradient(ellipse at 72% 55%,rgba(255,91,20,.22),transparent 45%),linear-gradient(180deg,rgba(36,3,3,.98),rgba(91,21,5,.82) 56%,rgba(22,7,4,.96));}
.player.realm-forest{background:radial-gradient(ellipse at 72% 48%,rgba(37,255,157,.18),transparent 46%),linear-gradient(180deg,rgba(3,38,27,.92),rgba(5,83,55,.74) 54%,rgba(2,30,23,.96));}
.player::after{content:'';position:absolute;inset:0;pointer-events:none;z-index:1;background:linear-gradient(90deg,rgba(0,0,0,.28) 0 32%,transparent 32% 100%);}
.player .realm-art,.player .realm-particles,.player .realm-label{z-index:2;}
.player .realm-label{font-size:70px;}
@media(max-width:1200px){.player{grid-template-columns:30% 1fr}.card:not(.land-card):not(.artifact-card){width:128px;height:176px}.creature-zone{gap:14px}}

/* v6.7.7 Frontline Arena: four real battlefield rows + armies at the front */
.battlefield{
    grid-template-rows:minmax(0,1fr) 54px auto minmax(0,1fr);
}
.player{
    grid-template-columns:minmax(230px,24%) minmax(0,1fr);
    gap:16px;
}
/* Resource rail: still compact, but readable from a TV */
.land-zone{
    gap:12px 10px;
    padding-left:16px;
    padding-right:16px;
}
.land-card{width:104px;height:122px;padding:9px;}
.land-card .icon{font-size:32px;}
.land-card .card-name{font-size:12px;}
.land-card .stats{font-size:12px;}
.artifact-card{width:100px;height:108px;padding:9px;}
/* Creatures form two opposing front lines around the phase strip */
.creature-zone{

<script>

const socket = io();

function getSpellEffectText(card) {
    if (!card) return "✨";
    if (card.effect === "damage") return `${card.icon || "🔥"} ${Number(card.damage || 0)} DAMAGE`;
    if (card.effect === "pump") return `${card.icon || "🌿"} +${Number(card.powerBonus || 0)}/+${Number(card.toughnessBonus || 0)}`;
    if (card.effect === "plus1_counter") {
        const n = Number(card.counters || 1);
        return `${card.icon || "➕"} +${n}/+${n} COUNTER`;
    }
    if (card.effect === "draw_cards") return `${card.icon || "📚"} DRAW ${Number(card.amount || 1)}`;
    if (card.effect === "discard_cards") return `${card.icon || "🧠"} DISCARD ${Number(card.amount || 1)}`;
    return `${card.icon || "✨"} ${card.name || "SPELL"}`;
}


socket.on(
    "gameState",
    state => {

        const stackDisplay = document.getElementById("stackDisplay");
        const stack = state.stack || [];
        if (stack.length) {
            stackDisplay.style.display = "block";
            stackDisplay.innerHTML = "STACK<br>" + stack.slice().reverse().map((item, i) => {
                const effect = item.card && item.card.type === "spell" ? ` · ${getSpellEffectText(item.card)}` : "";
                return `${i === 0 ? "⬆️" : "•"} ${item.card.icon || "✨"} ${item.card.name}${effect} · P${item.caster}`;
            }).join("<br>") + `<br><small>Priority: P${state.priorityPlayer}</small>`;
        } else {
            stackDisplay.style.display = "none";
        }

        renderGameState(
            state
        );
        if (state.gameOver) {
            showGameOver({ winner: state.winner, loser: state.loser, reason: state.gameOverReason });
        } else {
            const overlay = document.getElementById("gameOverOverlay");
            if (overlay) overlay.classList.remove("show");
        }
    }
);


socket.on(
    "combatMessage",
    data => {

        showMessage(
            data.text
        );
    }
);


socket.on(
    "combatResolved",
    data => {

        showMessage(
            data.messages.join(
                " "
            )
        );
    }
);


socket.on("spellCast", data => {
    showMessage(data.message);
});

socket.on(
    "spellResolved",
    data => {
        const fx = document.getElementById("spellFx");
        fx.textContent = getSpellEffectText(data.card);
        fx.classList.remove("cast");
        void fx.offsetWidth;
        fx.classList.add("cast");

        if (data.target && data.target.type === "creature") {
            const target = document.querySelector(`[data-creature-id="${data.target.id}"]`);
            if (target) {
                target.classList.remove("spell-hit");
                void target.offsetWidth;
                target.classList.add("spell-hit");
            }
        } else if (data.target && data.target.type === "player") {
            const section = document.querySelector(`.player-${data.target.player}`);
            if (section) {
                section.classList.remove("player-hit");
                void section.offsetWidth;
                section.classList.add("player-hit");
            }
        }

        showMessage(data.message);
    }
);


function showGameOver(data) {
    const overlay = document.getElementById("gameOverOverlay");
    if (!overlay) return;
    const winner = Number(data.winner || 0);
    document.getElementById("gameOverKicker").textContent = winner ? "🏆 VICTORY" : "⚔️ GAME OVER";
    document.getElementById("gameOverTitle").textContent = winner ? `PLAYER ${winner} WINS` : "DRAW";
    document.getElementById("gameOverReason").textContent = data.reason || "Kampen er slut.";
    overlay.classList.add("show");
}

socket.on("gameOver", showGameOver);

socket.on("gameReset", () => {
    const overlay = document.getElementById("gameOverOverlay");
    if (overlay) overlay.classList.remove("show");
});

function renderBattlefieldPhaseTracker(state){
 const step=state.turnStep||state.phase;
 const groups=[
 {name:"BEGINNING",steps:[["untap","Untap"],["upkeep","Upkeep"],["draw","Draw"]]},
 {name:"MAIN PHASE 1",steps:[["main1","Main 1"],["main","Main 1"]]},
 {name:"COMBAT",steps:[["begin_combat","Beginning"],["declare_attackers","Attackers"],["choose_attackers","Attackers"],["declare_blockers","Blockers"],["choose_blockers","Blockers"],["combat_damage","Damage"],["end_combat","End"]]},
 {name:"MAIN PHASE 2",steps:[["main2","Main 2"]]},
 {name:"ENDING",steps:[["end_step","End"],["cleanup","Cleanup"]]}];
 let gi=groups.findIndex(g=>g.steps.some(x=>x[0]===step)); if(gi<0)gi=0;
 const a=document.getElementById('bfMajor'),b=document.getElementById('bfSteps'); if(!a||!b)return;
 a.innerHTML=groups.map((g,i)=>`<span class="${i<gi?'done':i===gi?'active':''}">${i<gi?'✓ ':''}${g.name}</span>`).join('');
 const u=[];groups[gi].steps.forEach(x=>{if(!u.some(y=>y[1]===x[1]))u.push(x)});let ai=u.findIndex(x=>groups[gi].steps.filter(y=>y[1]===x[1]).some(y=>y[0]===step));
 b.innerHTML=u.map((x,i)=>`<span class="${i<ai?'done':i===ai?'active':''}">${i<ai?'✓ ':''}${x[1]}</span>`).join('');
}

function getRealmTheme(deckChoice) {
    if (!deckChoice) return "neutral";
    let text = "";
    try {
        text = typeof deckChoice === "string" ? deckChoice : JSON.stringify(deckChoice);
    } catch (e) {
        text = String(deckChoice);
    }
    text = text.toLowerCase();
    if (text.includes("burn") || text.includes("mountain") || text.includes("red") || text.includes("legion")) return "red";
    if (text.includes("forest") || text.includes("green") || text.includes("fury")) return "green";
    return "neutral";
}

function applyRealmThemes(state) {
    const choices = state && state.selectedDecks ? state.selectedDecks : {};
    [1,2].forEach(playerNumber => {
        const section = document.querySelector(`.player-${playerNumber}`);
        if (!section) return;
        const theme = getRealmTheme(choices[playerNumber]);
        section.classList.remove("theme-red","theme-green","theme-neutral");
        section.classList.add(`theme-${theme}`);
    });
}

function renderGameState(
    state
) {

    applyRealmThemes(state);
    renderBattlefieldPhaseTracker(state);

    document
        .getElementById(
            "turnPlayer"
        )
        .textContent =
        "PLAYER " +
        state.currentPlayer;


    document
        .getElementById(
            "turnNumber"
        )
        .textContent =
        state.turnNumber;


    const phases = {
        opening_hand: "OPENING HAND",
        untap: "UNTAP STEP",
        upkeep: "UPKEEP STEP",
        draw: "DRAW STEP",
        main: "PRECOMBAT MAIN",
        begin_combat: "BEGINNING OF COMBAT",
        choose_attackers: "DECLARE ATTACKERS",
        choose_blockers: "DECLARE BLOCKERS",
        combat_damage: "COMBAT DAMAGE",
        end_combat: "END OF COMBAT",
        main2: "MAIN PHASE 2",
        end_step: "END STEP",
        cleanup: "CLEANUP STEP"
    };


    document
        .getElementById(
            "phaseText"
        )
        .textContent =
        phases[
            state.phase
        ];


    renderPlayer(
        1,
        state.players[1],
        state
    );


    renderPlayer(
        2,
        state.players[2],
        state
    );
}


function renderPlayer(
    playerNumber,

) {

            `p${playerNumber}Grave`

                        artifact.activatedAbility.cost === "sacrifice_creature"

        }
    );


    // --------------------------------------
    // CREATURES
    // --------------------------------------

        creature => {

            const element =
                document.createElement(
                    "div"
                );


            element.className =
                "card";

            element.dataset.creatureId = creature.id;


            if (
                creature.tapped
            ) {

                element.classList.add(
                    "tapped"
                );
            }


            if (
                playerNumber ===
                    state.currentPlayer &&
                state.combat
                    .attackerIds
                    .includes(
                        creature.id
                    )
            ) {

                element.classList.add(
                    "attacking"
                );

                if (Array.isArray(creature.abilities) && creature.abilities.includes("vigilance")) {
                    element.classList.add("vigilance-attacker");
                }
            }


            const blockingTarget =
                findBlockingTarget(
                    creature.id,
                    state.combat
                        .blockers
                );


            if (blockingTarget) {

                element.classList.add(
                    "blocking"
                );
            }


            element.innerHTML = `

                <div class="card-name">
                    ${creature.name}
                </div>

                <div class="icon">
                    ${creature.icon}
                </div>

                <div class="stats">
                    ${Number(creature.power || 0)}/${Number(creature.toughness || 0)}
                </div>

            `;

            if (Array.isArray(creature.abilities) && creature.abilities.includes("trample")) {
                const ability = document.createElement("div");
                ability.className = "ability-mark";
                ability.textContent = "🐾 TRAMPLE";

            }

            if (Array.isArray(creature.abilities) && creature.abilities.includes("first_strike")) {
                const ability = document.createElement("div");
                ability.className = "ability-mark";
                ability.textContent = "⚔️ FIRST STRIKE";

            }

            if (Array.isArray(creature.abilities) && creature.abilities.includes("double_strike")) {
                const ability = document.createElement("div");
                ability.className = "ability-mark";
                ability.textContent = "⚔️⚔️ DOUBLE STRIKE";
                element.appendChild(ability);
            }

            if (Array.isArray(creature.abilities) && creature.abilities.includes("deathtouch")) {
                const ability = document.createElement("div");
                ability.className = "ability-mark";
                ability.textContent = "☠️ DEATHTOUCH";
                element.appendChild(ability);
            }

            if (Array.isArray(creature.abilities) && creature.abilities.includes("lifelink")) {
                const ability = document.createElement("div");
                ability.className = "ability-mark";
                ability.textContent = "❤️ LIFELINK";
                element.appendChild(ability);
            }

            if (Array.isArray(creature.abilities) && creature.abilities.includes("flying")) {
                const ability = document.createElement("div");
                ability.className = "ability-mark";
                ability.textContent = "🪽 FLYING";
                element.appendChild(ability);
            }

            if (Array.isArray(creature.abilities) && creature.abilities.includes("reach")) {
                const ability = document.createElement("div");
                ability.className = "ability-mark";
                ability.textContent = "🏹 REACH";
                element.appendChild(ability);
            }

            if (Array.isArray(creature.abilities) && creature.abilities.includes("vigilance")) {
                const ability = document.createElement("div");
                ability.className = "ability-mark";

            }

            if (Array.isArray(creature.abilities) && creature.abilities.includes("haste")) {
                const ability = document.createElement("div");

                element.appendChild(ability);
            }

            if (Array.isArray(creature.abilities) && creature.abilities.includes("menace")) {

            if (Array.isArray(creature.abilities) && creature.abilities.includes("hexproof")) {

            if (Array.isArray(creature.abilities) && creature.abilities.includes("ward_2")) {

            if (Array.isArray(creature.abilities) && creature.abilities.includes("protection_red")) {

// ======================================================
// COMBAT HELPERS
// ======================================================

function findBlockingTarget(
    blockerId,
    blockers
) {

    for (
        const attackerId
        of Object.keys(
            blockers
        )
    ) {

        if (
            (
                blockers[
                    attackerId
                ] || []
            )
            .includes(
                blockerId
            )
        ) {

            return attackerId;
        }
    }


    return null;
}


function findCreatureById(
    id,
    state
) {

    return [

        ...state.players[1]
            .creatures,

        ...state.players[2]
            .creatures

    ]
    .find(
        creature =>
            creature.id === id
    );
}


// ======================================================
// MESSAGE
// ======================================================

function showMessage(text) {

    const element =
        document.getElementById(
            "message"
        );


    element.textContent =
        text;


    element
        .classList
        .remove(
            "show"
        );


    void element.offsetWidth;


    element
        .classList
        .add(
            "show"
        );
}
